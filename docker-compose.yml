name: student-management

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_management
      POSTGRES_USER: student
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Cache is disposable; PostgreSQL is the source of truth.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-student-management:compose}
    restart: unless-stopped
    environment:
      # Use the service name and container port, not localhost or a host port.
      # POSTGRES_PASSWORD must be URL-safe; generate it as described in DOCKER.md.
      DATABASE_URL: postgresql+psycopg://student:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/student_management
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      SQL_ECHO: "${SQL_ECHO:-false}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-30}"
      CORS_ORIGINS: "${CORS_ORIGINS:-[]}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STUDENTS_CACHE_TTL_SECONDS: "${STUDENTS_CACHE_TTL_SECONDS:-60}"
      STUDENTS_CACHE_NAMESPACE: "${STUDENTS_CACHE_NAMESPACE:-student-management}"
    ports:
      - "127.0.0.1:${APP_PORT:-8002}:8000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        python -m alembic upgrade head &&
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
