name: Test suite

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite://
      SQL_ECHO: 'false'

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.9'
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --locked --dev

      - name: Run backend test suite
        continue-on-error: false
        run: uv run --no-sync pytest -q

  frontend:
    name: Frontend tests (Node.js 24)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run frontend test suite
        continue-on-error: false
        run: node tests/frontend_auth.test.mjs

  compose:
    name: Docker Compose integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: student-management-ci
      APP_IMAGE: student-management:ci
      APP_PORT: '18080'
      POSTGRES_PASSWORD: ci-only-postgres-password
      JWT_SECRET_KEY: ci-only-jwt-signing-key-do-not-use-in-production-0123456789
      SQL_ECHO: 'false'
      STUDENTS_CACHE_TTL_SECONDS: '60'
      STUDENTS_CACHE_NAMESPACE: student-management-ci

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Test HTTP, PostgreSQL and Redis cache
        run: docker compose exec -T app python - < scripts/compose_smoke.py

      - name: Create volume persistence probe
        run: >-
          docker compose exec -T db psql -U student -d student_management -v ON_ERROR_STOP=1
          -c "CREATE TABLE ci_persistence_probe (id integer PRIMARY KEY); INSERT INTO ci_persistence_probe VALUES (1);"

      - name: Recreate containers and verify persistence
        shell: bash
        run: |
          docker compose up -d --force-recreate --wait --wait-timeout 180
          actual=$(docker compose exec -T db psql -U student -d student_management -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM ci_persistence_probe")
          test "$actual" = "1"
          docker compose exec -T app python - < scripts/compose_smoke.py

      - name: Show service state and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100 app db redis

      - name: Clean up isolated CI resources
        if: always()
        run: docker compose down --volumes --remove-orphans
